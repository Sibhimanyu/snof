name: SNOF Firebase Bridge
version: "0.6.3"
slug: snof_bridge
description: Mirrors Home Assistant entity states to Firebase Realtime Database, grouped by area, for the SNOF dashboard.
url: https://github.com/sibhimanyu/snof
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
map:
  - type: addon_config
    read_only: false
options:
  firebase_db_url: ""
  service_account_path: "/config/serviceAccount.json"
  farm_slug: "snof"
  farm_name: "Sibhi Natural Orchards and Farms"
  exclude_domains:
    - automation
    - script
    - scene
    - persistent_notification
    - tts
    - update
    - button
    - input_button
    - conversation
    - todo
  exclude_entities: []
  include_domains: []
  expose_location: false
  min_interval_seconds: 2
  flush_interval_seconds: 1
  heartbeat_seconds: 30
  # Device control. Leave false to keep the bridge strictly read-only; turning it
  # on lets allowlisted controllers operate the domains listed below, and nothing
  # else, through the /commands queue.
  allow_control: false
  control_domains:
    - switch
    - light
    - fan
    - input_boolean
  control_max_age_seconds: 120
  log_level: info
  # Irrigation reports (Mobitech DCON, Livesky, Niagara, OpenWeather). Leave
  # false to answer nothing; turning it on lets allowlisted controllers build
  # report requests in the dashboard, which the bridge executes on demand —
  # nothing is polled. Credentials stay on the NUC and are never mirrored.
  # Nothing here can operate a pump.
  irrigation_enabled: false
  livesky_base: "https://gsm.liveskytech.com:3001"
  livesky_bearer: ""
  livesky_imei: ""
  niagara_base: ""
  niagara_user: ""
  niagara_clusters: []
  dcon_base: "https://dcon.mobitechwireless.com"
  dcon_serial: ""
  dcon_device_id: ""
  dcon_token_id: ""
  dcon_product: "DCON"
  owm_appid: ""
  owm_place: ""
schema:
  firebase_db_url: url
  service_account_path: str
  farm_slug: match(^[a-z0-9_-]+$)
  farm_name: str
  exclude_domains:
    - str
  exclude_entities:
    - str
  include_domains:
    - str
  expose_location: bool
  min_interval_seconds: float(0,3600)
  flush_interval_seconds: float(0.2,60)
  heartbeat_seconds: int(5,3600)
  allow_control: bool
  control_domains:
    - list(switch|light|fan|input_boolean)
  control_max_age_seconds: float(5,3600)
  log_level: list(trace|debug|info|warning|error)
  irrigation_enabled: bool
  livesky_base: url
  livesky_bearer: str
  livesky_imei: str
  niagara_base: str
  niagara_user: str
  niagara_clusters:
    - str
  dcon_base: url
  dcon_serial: str
  dcon_device_id: str
  dcon_token_id: str
  dcon_product: str
  owm_appid: str
  owm_place: str
