name: SNOF Firebase Bridge
version: "0.10.11"
slug: snof_bridge
description: Mirrors Home Assistant entity states to Firebase Realtime Database, grouped by area, for the SNOF dashboard.
url: https://github.com/Sibhimanyu/snof
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
# manager is the least role that may reload the store and update an add-on
# (supervisor/api/middleware/security.py: the default role gets /info only).
hassio_api: true
hassio_role: manager
host_network: false
map:
  - type: addon_config
    read_only: false
options:
  firebase_db_url: ""
  service_account_path: "/config/serviceAccount.json"
  farm_slug: "snof"
  farm_name: "Sibhi Natural Orchards and Farms"
  exclude_domains:
    - automation
    - script
    - scene
    - persistent_notification
    - tts
    - update
    - button
    - input_button
    - conversation
    - todo
  exclude_entities: []
  include_domains: []
  expose_location: false
  min_interval_seconds: 2
  flush_interval_seconds: 1
  heartbeat_seconds: 30
  # Device control. Leave false to keep the bridge strictly read-only; turning it
  # on lets allowlisted controllers operate the domains listed below, and nothing
  # else, through the /commands queue.
  allow_control: false
  control_domains:
    - switch
    - light
    - fan
    - input_boolean
    - climate
  control_max_age_seconds: 120
  log_level: info
  # DCON relay. Irrigation reports are built by a Cloud Function, but
  # Mobitech refuses Google Cloud addresses, so the Function asks the bridge
  # to make its read calls from the farm's connection. Eight named reads,
  # nothing else; the serial and token never leave this box.
  dcon_relay: false
  dcon_base: "https://dcon.mobitechwireless.com"
  dcon_serial: ""
  dcon_token_id: ""
  dcon_product: "DCON"
  # Irrigation control. Leave false and the controller can only be read.
  # Turning it on lets farm admins start a manual run on irrigation valves
  # (never the tank, booster or backwash valve) for up to
  # irrigation_max_minutes, and stop a manual run. The command credential is
  # the Mobitech app's session authorization ("…@ios"), the device id is the
  # controller's (dashboard device_id), the slot is the Mobitech user it is
  # sent as (A8 = sibhi).
  allow_irrigation_control: false
  dcon_device_id: ""
  dcon_command_auth: ""
  dcon_user_slot: ""
  irrigation_max_minutes: 60
  # Remote update. Leave false and the apps only show the version; true lets
  # farm admins press Update in the apps (docs/nuc-access-and-deploy.md).
  allow_remote_update: false
schema:
  firebase_db_url: url
  service_account_path: str
  farm_slug: match(^[a-z0-9_-]+$)
  farm_name: str
  exclude_domains:
    - str
  exclude_entities:
    - str
  include_domains:
    - str
  expose_location: bool
  min_interval_seconds: float(0,3600)
  flush_interval_seconds: float(0.2,60)
  heartbeat_seconds: int(5,3600)
  allow_control: bool
  control_domains:
    - list(switch|light|fan|input_boolean|climate)
  control_max_age_seconds: float(5,3600)
  log_level: list(trace|debug|info|warning|error)
  dcon_relay: bool
  dcon_base: url
  dcon_serial: str
  dcon_token_id: password
  dcon_product: str
  allow_irrigation_control: bool
  dcon_device_id: str
  dcon_command_auth: password
  dcon_user_slot: str
  irrigation_max_minutes: int(1,180)
  allow_remote_update: bool
