<script>
(function(){
  const params=new URLSearchParams(location.search);
  const now=Date.now();
  const A={pump_house:'Pump House',packing_shed:'Packing Shed',orchard_east:'East Orchard',
           farmhouse:'Farmhouse',cold_store:'Cold Store',nursery:'Nursery'};
  const data={
    meta:{name:'Sibhi Natural Orchards', bridge:{status:'online', lastSeen: now-(params.get('stale')?400000:5000), heartbeatSeconds:30, control:true}},
    areas:Object.fromEntries(Object.entries(A).map(([k,v])=>[k,{name:v}])),
    entities:{
      sensor:{
        tank_level:{name:'Main tank level',entity_id:'sensor.tank_level',state:'71',area:'pump_house',attrs:{unit_of_measurement:'%',device_class:'moisture'}},
        soil_e1:{name:'Soil moisture row 1',entity_id:'sensor.soil_e1',state:'34.2',area:'orchard_east',attrs:{unit_of_measurement:'%',battery_level:82}},
        soil_e2:{name:'Soil moisture row 2',entity_id:'sensor.soil_e2',state:'unavailable',area:'orchard_east',attrs:{battery_level:12}},
        temp_out:{name:'Outdoor temperature',entity_id:'sensor.temp_out',state:'31.4',area:'farmhouse',attrs:{unit_of_measurement:'°C',device_class:'temperature'}},
        power:{name:'Grid import',entity_id:'sensor.power',state:'1840',attrs:{unit_of_measurement:'W',device_class:'power'}},
        humidity:{name:'Shed humidity',entity_id:'sensor.humidity',state:'58',area:'packing_shed',attrs:{unit_of_measurement:'%',device_class:'humidity'}},
        cold_temp:{name:'Cold store temperature',entity_id:'sensor.cold_temp',state:'3.8',area:'cold_store',attrs:{unit_of_measurement:'°C',device_class:'temperature'}},
        flow:{name:'Bore flow rate',entity_id:'sensor.flow',state:'42.5',area:'pump_house',attrs:{unit_of_measurement:'L/min'}},
        nursery_lux:{name:'Nursery light level',entity_id:'sensor.nursery_lux',state:'12400',area:'nursery',attrs:{unit_of_measurement:'lx',device_class:'illuminance'}}
      },
      switch:{
        pump_main:{name:'Bore pump',entity_id:'switch.pump_main',state:'on',area:'pump_house',attrs:{}},
        pump_drip:{name:'Drip line pump',entity_id:'switch.pump_drip',state:'off',area:'pump_house',attrs:{}},
        shed_lights:{name:'Shed lights',entity_id:'switch.shed_lights',state:'off',area:'packing_shed',attrs:{}},
        compressor:{name:'Cold room compressor',entity_id:'switch.compressor',state:'on',area:'cold_store',attrs:{}},
        fence:{name:'Fence energiser',entity_id:'switch.fence',state:'on',area:'orchard_east',attrs:{}},
        mister:{name:'Nursery misters',entity_id:'switch.mister',state:'off',area:'nursery',attrs:{}}
      },
      light:{
        porch:{name:'Porch light',entity_id:'light.porch',state:'on',area:'farmhouse',attrs:{brightness:196}},
        packing_bay:{name:'Packing bay light',entity_id:'light.packing_bay',state:'on',area:'packing_shed',attrs:{brightness:128}},
        grow_1:{name:'Grow light bank 1',entity_id:'light.grow_1',state:'off',area:'nursery',attrs:{brightness:0}}
      },
      fan:{
        shed_extract:{name:'Shed extractor',entity_id:'fan.shed_extract',state:'on',area:'packing_shed',attrs:{percentage:66}},
        cold_circ:{name:'Cold store circulation',entity_id:'fan.cold_circ',state:'on',area:'cold_store',attrs:{percentage:40}},
        nursery_fan:{name:'Nursery fan',entity_id:'fan.nursery_fan',state:'off',area:'nursery',attrs:{percentage:0}}
      },
      binary_sensor:{
        gate:{name:'Front gate',entity_id:'binary_sensor.gate',state:'off',area:'farmhouse',attrs:{device_class:'opening'}},
        cold_room_door:{name:'Cold room door',entity_id:'binary_sensor.cold_room_door',state:'on',area:'cold_store',attrs:{device_class:'door',battery_level:64}},
        motion_yard:{name:'Yard motion',entity_id:'binary_sensor.motion_yard',state:'off',attrs:{device_class:'motion'}},
        leak:{name:'Pump house leak',entity_id:'binary_sensor.leak',state:'unavailable',area:'pump_house',attrs:{device_class:'moisture'}}
      },
      lock:{ gate_lock:{name:'Gate lock',entity_id:'lock.gate_lock',state:'locked',area:'farmhouse',attrs:{}} }
    }
  };
  if(params.get('real')){
    const req=new XMLHttpRequest(); req.open('GET','farm-real.json',false); req.send(null);
    const f=JSON.parse(req.responseText);
    data.areas=f.areas; data.entities=f.entities;
    data.meta.name='Sibhi Natural Orchards and Farms';
  }
  if(params.get('big')){
    const doms=['sensor','binary_sensor','switch','light','number','select','update','event'];
    const names=['Zone valve','Soil probe','Fence energiser','Water meter','Tank float','Weather station','Frost alarm','Irrigation controller','Solar inverter','Battery bank'];
    for(let i=0;i<1350;i++){
      const d=doms[i%doms.length]; const n=names[i%names.length]+' '+(Math.floor(i/names.length)+1);
      const st=d==='sensor'?String((i*7.3%100).toFixed(1)):(d==='binary_sensor'||d==='switch'||d==='light')?(i%3?'off':'on'):d==='event'?'unknown':String(i%50);
      const attrs=d==='sensor'?{unit_of_measurement:i%4?'%':'°C'}:{};
      if(i%7===0) attrs.battery_level=(i*13)%100;
      data.entities[d]=data.entities[d]||{};
      data.entities[d]['gen_'+i]={name:n,entity_id:d+'.gen_'+i,state:st,attrs};
    }
  }
  const user=params.get('gate')?null:{uid:'u1',email:'sibhi@example.com',displayName:'Sibhi Govindasamy'};
  const denied=params.get('denied');
  const controller=params.get('viewer')?false:true;
  const store={'acl/controllers/u1':controller,'.info/serverTimeOffset':0};
  window.firebase={
    app:()=>({options:{databaseURL:'https://mock'}}),
    auth:Object.assign(()=>({
      onAuthStateChanged:(cb)=>cb(denied?{uid:'u2',email:'guest@example.com'}:user),
      signInWithPopup:()=>Promise.resolve(), signOut:()=>Promise.resolve()
    }),{GoogleAuthProvider:function(){this.setCustomParameters=()=>{}}}),
    database:Object.assign(()=>({ref:(path)=>({
      push:()=>({set:(v)=>{console.log('COMMAND',JSON.stringify(v));return Promise.resolve();}}),
      on:(ev,cb,err)=>{
        if(path.endsWith('/entities')) window.__push=(u)=>{
          data.entities[u.domain][u.id].state=u.state; cb({val:()=>data.entities}); };
        if(path in store){cb({val:()=>store[path]});return cb;}
        const key=path.split('/').pop();
        if(params.get('nodata')) return cb;             // never delivers: the loading state
        if(denied){ err&&err({code:'PERMISSION_DENIED'}); return cb; }
        cb({val:()=>data[key]}); return cb; },
      off:()=>{}
    })}),{ServerValue:{TIMESTAMP:{'.sv':'timestamp'}}})
  };
})();
</script>
